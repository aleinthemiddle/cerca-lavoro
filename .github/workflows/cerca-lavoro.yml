name: Cerca lavoro

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti (GitHub a volte ritarda di qualche minuto)
  workflow_dispatch:          # pulsante "Run workflow" per avviarlo a mano

permissions:
  contents: write   # per salvare annunci_visti.json
  pages: write      # per pubblicare la pagina annunci
  id-token: write

env:
  TZ: Europe/Rome

concurrency:
  group: cerca-lavoro
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.pagina.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Librerie
        run: pip install requests beautifulsoup4

      - name: Decifra il CV
        env:
          CV_PASSWORD: ${{ secrets.CV_PASSWORD }}
        run: |
          if [ -n "$CV_PASSWORD" ] && [ -f cv.pdf.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in cv.pdf.enc -out "$RUNNER_TEMP/CV.pdf" -pass env:CV_PASSWORD
          fi

      - name: Cerca annunci
        env:
          PRIVATO_JSON: ${{ secrets.PRIVATO_JSON }}
          SMTP_PASSWORD_APP: ${{ secrets.SMTP_PASSWORD_APP }}
          CANDIDATURE_ATTIVE: ${{ vars.CANDIDATURE_ATTIVE }}
          CV_PATH: ${{ runner.temp }}/CV.pdf
          PAGINA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python cerca_lavoro.py --una-volta

      - name: Salva gli annunci visti
        run: |
          git config user.name "cerca-lavoro-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add annunci_visti.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Aggiorna annunci visti [skip ci]"
            git pull -q --rebase -X theirs || true
            git push -q
          fi

      - name: Prepara pagina
        run: mkdir -p sito && cp annunci.html sito/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito

      - id: pagina
        uses: actions/deploy-pages@v4

      - name: Log
        if: always()
        run: tail -n 40 log.txt || true
